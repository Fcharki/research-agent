services:
  # ---------------------------------------------------------------------------
  # LLM runtime
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pull the model the agent expects, then exit.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull qwen3:0.6b
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend API + agent loop
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CORS_ORIGINS: http://localhost:3000
      DB_PATH: /data/research.db
    volumes:
      - backend_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # URL the browser uses to reach the API.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  backend_data:
